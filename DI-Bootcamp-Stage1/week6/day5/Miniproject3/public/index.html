<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strategy Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Registration Screen -->
  <div id="register-screen">
    <div class="register-box">
      <h1>⚔️ Strategy Game</h1>
      <p>Two players, one browser. Capture the opponent's base to win!</p>
      <div class="player-inputs">
        <div class="player-input p1">
          <label>🟢 Player 1</label>
          <input id="p1-input" type="text" placeholder="Enter username" maxlength="15">
        </div>
        <div class="player-input p2">
          <label>🔵 Player 2</label>
          <input id="p2-input" type="text" placeholder="Enter username" maxlength="15">
        </div>
      </div>
      <button id="start-btn">Start Game</button>
      <div id="register-error" class="error"></div>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="game-screen">
    <div class="game-layout">

      <!-- Left panel -->
      <div class="side-panel">
        <div class="player-card p1-card" id="p1-card">
          <div class="player-icon">🟢</div>
          <div class="player-name" id="p1-name"></div>
          <div class="player-label">Player 1</div>
          <div class="base-label">Base: [0, 0]</div>
        </div>
        <div class="vs-divider">VS</div>
        <div class="player-card p2-card" id="p2-card">
          <div class="player-icon">🔵</div>
          <div class="player-name" id="p2-name"></div>
          <div class="player-label">Player 2</div>
          <div class="base-label">Base: [9, 9]</div>
        </div>

        <div class="legend">
          <h4>Legend</h4>
          <div class="legend-item"><span class="legend-cell lc-p1"></span> Player 1</div>
          <div class="legend-item"><span class="legend-cell lc-p2"></span> Player 2</div>
          <div class="legend-item"><span class="legend-cell lc-base1"></span> Base 1</div>
          <div class="legend-item"><span class="legend-cell lc-base2"></span> Base 2</div>
          <div class="legend-item"><span class="legend-cell lc-obs"></span> Obstacle</div>
        </div>
      </div>

      <!-- Center panel -->
      <div class="center-panel">
        <div id="turn-banner"><span id="turn-text"></span></div>
        <div id="board"></div>
        <div id="controls">
          <button class="dir-btn" onclick="move('up')">↑</button>
          <div class="dir-row">
            <button class="dir-btn" onclick="move('left')">←</button>
            <div class="dir-center">✦</div>
            <button class="dir-btn" onclick="move('right')">→</button>
          </div>
          <button class="dir-btn" onclick="move('down')">↓</button>
        </div>
        <div id="message-box"></div>
        <button id="new-game-btn" onclick="newGame()">🔄 New Game</button>
      </div>

    </div>
  </div>

  <script>
    let gameState = null;
    let controlsDisabled = false;

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('p2-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') startGame();
    });

    async function startGame() {
      const p1Username = document.getElementById('p1-input').value.trim();
      const p2Username = document.getElementById('p2-input').value.trim();
      const errDiv = document.getElementById('register-error');

      if (!p1Username || !p2Username) { errDiv.textContent = 'Both usernames are required.'; return; }
      if (p1Username === p2Username) { errDiv.textContent = 'Usernames must be different.'; return; }
      errDiv.textContent = '';

      // Reset any existing game
      await fetch('/game/reset', { method: 'POST' });

      // Register both players
      const r1 = await fetch('/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: p1Username }) });
      const r2 = await fetch('/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: p2Username }) });
      if (!r1.ok || !r2.ok) { errDiv.textContent = 'Registration failed. Try again.'; return; }

      // Start game
      const res = await fetch('/game/start', { method: 'POST' });
      const data = await res.json();
      if (!res.ok) { errDiv.textContent = data.message; return; }

      gameState = data.state;
      controlsDisabled = false;

      document.getElementById('p1-name').textContent = p1Username;
      document.getElementById('p2-name').textContent = p2Username;
      document.getElementById('register-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'flex';

      renderBoard();
      updateTurnBanner();
    }

    async function move(direction) {
      if (!gameState || gameState.status !== 'playing' || controlsDisabled) return;

      const currentPlayer = gameState.players[gameState.currentTurn];
      const res = await fetch('/game/move', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: currentPlayer.username, direction })
      });
      const data = await res.json();

      if (!res.ok) {
        showMessage(data.message, 'error');
        return;
      }

      gameState = data.state;
      renderBoard();

      if (data.winner) {
        updateTurnBanner(true);
        showMessage(`🏆 ${data.winner} wins! They captured the enemy base!`, 'win');
        controlsDisabled = true;
      } else {
        clearMessage();
        updateTurnBanner();
      }
    }

    function renderBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';

      const p1 = gameState.players[0];
      const p2 = gameState.players[1];

      for (let row = 0; row < 10; row++) {
        for (let col = 0; col < 10; col++) {
          const cell = document.createElement('div');
          cell.classList.add('cell');
          cell.title = `[${row}, ${col}]`;

          const isP1 = p1.position.row === row && p1.position.col === col;
          const isP2 = p2.position.row === row && p2.position.col === col;
          const isBase1 = p1.base.row === row && p1.base.col === col;
          const isBase2 = p2.base.row === row && p2.base.col === col;
          const isObstacle = gameState.grid[row][col] === 'obstacle';

          if (isP1) {
            cell.classList.add('cell-p1');
            cell.textContent = '●';
          } else if (isP2) {
            cell.classList.add('cell-p2');
            cell.textContent = '●';
          } else if (isBase1) {
            cell.classList.add('cell-base1');
            cell.textContent = '⌂';
          } else if (isBase2) {
            cell.classList.add('cell-base2');
            cell.textContent = '⌂';
          } else if (isObstacle) {
            cell.classList.add('cell-obstacle');
            cell.textContent = '▪';
          } else {
            cell.classList.add('cell-empty');
          }

          board.appendChild(cell);
        }
      }

      // Highlight active player card
      document.getElementById('p1-card').classList.toggle('active', gameState.currentTurn === 0);
      document.getElementById('p2-card').classList.toggle('active', gameState.currentTurn === 1);
    }

    function updateTurnBanner(finished = false) {
      const text = document.getElementById('turn-text');
      if (finished) {
        text.textContent = 'Game Over';
        return;
      }
      const player = gameState.players[gameState.currentTurn];
      const icon = gameState.currentTurn === 0 ? '🟢' : '🔵';
      text.textContent = `${icon} ${player.username}'s turn`;
    }

    function showMessage(text, type) {
      const box = document.getElementById('message-box');
      box.textContent = text;
      box.className = type;
    }

    function clearMessage() {
      const box = document.getElementById('message-box');
      box.textContent = '';
      box.className = '';
    }

    async function newGame() {
      document.getElementById('game-screen').style.display = 'none';
      document.getElementById('register-screen').style.display = 'flex';
      document.getElementById('p1-input').value = '';
      document.getElementById('p2-input').value = '';
      clearMessage();
      gameState = null;
      controlsDisabled = false;
    }
  </script>
</body>
</html>
